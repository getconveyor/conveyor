version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: conveyor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conveyor}
      POSTGRES_USER: ${POSTGRES_USER:-conveyor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conveyor_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conveyor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conveyor-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: conveyor-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conveyor-network

  # MinIO Object Storage (S3 compatible)
  minio:
    image: minio/minio:latest
    container_name: conveyor-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - conveyor-network

  # Django Server
  server:
    build:
      context: ./conveyor-server
      dockerfile: Dockerfile
    container_name: conveyor-server
    restart: unless-stopped
    environment:
      # Django
      DJANGO_SETTINGS_MODULE: conveyor_server.settings
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,server}

      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-conveyor}
      POSTGRES_USER: ${POSTGRES_USER:-conveyor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conveyor_password}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # MinIO/S3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-conveyor-storage}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # Encryption Key for password storage
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-S5ffr3p0XI1yCl8-HENXVLcFpjkFGmmdsvUR6SyCJsg=}
    volumes:
      - ./conveyor-server:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conveyor-network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60 --access-logfile - --error-logfile - --reload conveyor_server.wsgi:application"

  # Next.js Web App
  web:
    build:
      context: ./conveyor-web
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-runner}
    container_name: conveyor-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - server
    networks:
      - conveyor-network

  # Celery Worker (for background tasks)
  celery-worker:
    build:
      context: ./conveyor-server
      dockerfile: Dockerfile
    container_name: conveyor-celery-worker
    restart: unless-stopped
    command: celery -A conveyor_server worker -l info
    environment:
      # Django
      DJANGO_SETTINGS_MODULE: conveyor_server.settings
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}

      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-conveyor}
      POSTGRES_USER: ${POSTGRES_USER:-conveyor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conveyor_password}

      # Redis (Celery broker)
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # MinIO/S3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

      # Encryption Key for password storage
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-S5ffr3p0XI1yCl8-HENXVLcFpjkFGmmdsvUR6SyCJsg=}
    volumes:
      - ./conveyor-server:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conveyor-network

  # Celery Beat (for scheduled tasks)
  celery-beat:
    build:
      context: ./conveyor-server
      dockerfile: Dockerfile
    container_name: conveyor-celery-beat
    restart: unless-stopped
    command: celery -A conveyor_server beat -l info
    environment:
      # Django
      DJANGO_SETTINGS_MODULE: conveyor_server.settings
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}

      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-conveyor}
      POSTGRES_USER: ${POSTGRES_USER:-conveyor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conveyor_password}

      # Redis (Celery broker)
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Encryption Key for password storage
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-S5ffr3p0XI1yCl8-HENXVLcFpjkFGmmdsvUR6SyCJsg=}
    volumes:
      - ./conveyor-server:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conveyor-network

  # Hive Metastore (for Iceberg catalog)
  hive-metastore:
    build:
      context: ./hive-metastore
      dockerfile: Dockerfile
    container_name: conveyor-metastore
    restart: unless-stopped
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: "-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-conveyor} -Djavax.jdo.option.ConnectionUserName=${POSTGRES_USER:-conveyor} -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD:-conveyor_password}"
      # S3 Configuration for MinIO
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_ENDPOINT: http://minio:9000
      S3_PATH_STYLE_ACCESS: "true"
    ports:
      - "${METASTORE_PORT:-9083}:9083"
    volumes:
      - metastore_data:/opt/hive/data/warehouse
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - conveyor-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9083"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Trino Query Engine (for SQL on Iceberg)
  trino:
    image: trinodb/trino:438
    container_name: conveyor-trino
    restart: unless-stopped
    ports:
      - "${TRINO_PORT:-8090}:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/config.properties:/etc/trino/config.properties:ro
    environment:
      # MinIO S3 credentials
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      # PostgreSQL credentials for federated queries
      POSTGRES_USER: ${POSTGRES_USER:-conveyor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conveyor_password}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    networks:
      - conveyor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  metastore_data:
    driver: local

networks:
  conveyor-network:
    driver: bridge
